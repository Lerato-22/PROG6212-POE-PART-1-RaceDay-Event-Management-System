name: Validate Part 1 Structure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Check docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: docs folder is missing"
            exit 1
          fi
          echo "docs folder found"

      - name: Check required files exist
        run: |
          files=(
            "docs/ERD_drawio.png"
            "docs/raceday_api_endpoint_plan.pdf"
            "docs/raceday_database.sql"
          )
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "ERROR: $f is missing"
              exit 1
            else
              echo "FOUND: $f"
            fi
          done

      - name: All checks passed
        run: echo "All required Part 1 files are present"
